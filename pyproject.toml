[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redteam-framework"
version = "1.0.0"
description = "Reproducible red-teaming and safety-evaluation framework for AI agents (OJT project, G132)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prince Kumar Maurya" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
agent-redteam = "agent_redteam.cli:main"

[tool.setuptools.packages.find]
include = ["agent_redteam*"]

[tool.setuptools.package-data]
agent_redteam = ["attacks/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
